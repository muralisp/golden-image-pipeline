name: Golden Image Pipeline

# Builds, hardens, validates, and publishes a "golden" OS image using
# Packer (build automation) + Kickstart (unattended OS install) +
# PXE config (network boot for on-prem baremetal targets).
#
# Trigger on a schedule (monthly patch refresh), on changes to the
# image-definition files, or manually with an environment input.

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to build/publish the image for"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
  schedule:
    - cron: "0 3 1 * *"   # monthly rebuild for patching / CVE refresh
  push:
    branches: [main]
    paths:
      - "packer/**"
      - "kickstart/**"
      - "pxe/**"
      - "scripts/**"

permissions:
  contents: read

env:
  PACKER_VERSION: "1.11.2"
  IMAGE_NAME: "golden-image"

jobs:
  # ---------------------------------------------------------------
  # 1. Lint & validate all image-definition source before building
  # ---------------------------------------------------------------
  validate:
    name: Validate Packer + Kickstart + PXE configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer init (download plugins)
        run: packer init packer/image.pkr.hcl

      - name: Packer fmt check
        run: packer fmt -check -diff packer/

      - name: Packer validate
        run: packer validate packer/image.pkr.hcl

      - name: Lint Kickstart file (ksvalidator)
        run: |
          pip install --quiet pykickstart
          ksvalidator kickstart/golden.ks

      - name: Shellcheck hardening scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

  # ---------------------------------------------------------------
  # 2. Build the image with Packer (which drives the Kickstart
  #    unattended install) and run the hardening script inside it
  # ---------------------------------------------------------------
  build:
    name: Build golden image
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      # Static IAM user credentials (long-lived) — simpler to set up than OIDC,
      # but requires manual key rotation. See README for the trade-offs.
      - name: Configure cloud credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Packer init
        run: packer init packer/image.pkr.hcl

      - name: Build image
        id: build
        run: |
          packer build \
            -var "image_name=${{ env.IMAGE_NAME }}-$(date +%Y%m%d)" \
            -var "kickstart_file=kickstart/golden.ks" \
            -var "hardening_script=scripts/harden.sh" \
            -color=false \
            packer/image.pkr.hcl | tee packer-build.log

      - name: Capture built image ID
        id: image_id
        run: |
          IMAGE_ID=$(grep -oP '(?<=Artifact ID: )\S+' packer-build.log | tail -1)
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log
          path: packer-build.log

    outputs:
      image_id: ${{ steps.image_id.outputs.image_id }}

  # ---------------------------------------------------------------
  # 3. Scan the IaC source for misconfig/secrets. CVE and CIS-benchmark
  #    scanning of the actual image happens inside the Packer build
  #    itself (see packer/image.pkr.hcl) — the build fails outright if
  #    either check finds a CRITICAL/HIGH issue, so a vulnerable or
  #    non-compliant image never reaches this stage in the first place.
  # ---------------------------------------------------------------
  scan:
    name: Scan IaC source (misconfig + secrets)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: OS package CVE scanning happens *inside* the Packer build
      # now (see packer/image.pkr.hcl) — Trivy's image scan-type can't
      # target an AMI ID directly, only container images/tarballs, so
      # scanning it here against a GitHub runner with no access to the
      # built AMI's filesystem never worked. This step instead scans
      # the IaC source itself for misconfigurations and accidentally
      # committed secrets (hardcoded passwords/keys in the Kickstart,
      # Packer template, or hardening scripts).
      - name: Trivy config & secret scan (IaC source)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scanners: "misconfig,secret"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"

      # Note: the CIS/OpenSCAP compliance scan also now runs inside the
      # Packer build (see the oscap provisioner in image.pkr.hcl) and
      # gates the build itself — a compliance-failing image never
      # finishes building. The report lands at
      # /var/log/cis-baseline-report.html on the built instance; pull
      # it via SSM Session Manager or scp against a launched instance
      # if you need to review it after the fact.

  # ---------------------------------------------------------------
  # 4. Publish the golden image to the image registry / cloud image
  #    catalog and register PXE boot entries for baremetal targets
  # ---------------------------------------------------------------
  publish:
    name: Publish image & register PXE entry
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag image as validated/golden
        run: |
          echo "Promoting ${{ needs.build.outputs.image_id }} to golden-validated"
          # e.g. aws ec2 create-tags / az image update / gcloud compute images update

      - name: Sync PXE boot config for baremetal fleet
        run: |
          echo "Copying PXE config + kickstart to TFTP/HTTP boot server"
          rsync -av pxe/pxelinux.cfg/ "${{ secrets.PXE_SERVER_HOST }}:/tftpboot/pxelinux.cfg/"
          rsync -av kickstart/golden.ks "${{ secrets.PXE_SERVER_HOST }}:/var/www/html/ks/golden.ks"

      - name: Notify team
        run: |
          echo "Golden image ${{ needs.build.outputs.image_id }} published for ${{ github.event.inputs.target_env || 'staging' }}"
          # e.g. Slack webhook notification here
